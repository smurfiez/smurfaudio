name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode 16 (Swift Testing Support)
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version
          swift --version

      - name: Install BlackHole Audio Driver
        run: |
          echo "Installing BlackHole 2ch virtual audio driver..."
          if ! brew list --cask blackhole-2ch &>/dev/null; then
            brew install --cask blackhole-2ch || sudo installer -pkg Prerequisites/BlackHole2ch-0.7.1.pkg -target /
          fi
          sudo launchctl kickstart -kp system/com.apple.audio.coreaudiod 2>/dev/null || sudo killall -9 coreaudiod 2>/dev/null || true
          sleep 3
          system_profiler SPAudioDataType | grep -A 5 -i "BlackHole" || true

      - name: Run Swift Unit Tests
        run: ./run_tests.sh

      - name: Build SmurfAudio App Bundle (Release)
        run: ./build_app.sh release

      - name: Build Installer Package
        run: ./create_installer.sh

      - name: Build Disk Image (DMG)
        run: ./create_dmg.sh

      - name: Verify Build Artifacts
        run: |
          echo "Verifying generated files..."
          test -d SmurfAudio.app
          test -f SmurfAudioInstaller.pkg
          test -f SmurfAudio.dmg
          ls -lh SmurfAudio.app SmurfAudioInstaller.pkg SmurfAudio.dmg
