name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.3.1)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft?'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.3.0")
          fi
          echo "version_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release for tag: $TAG"

      - name: Select Xcode 16 (Swift Testing Support)
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version
          swift --version

      - name: Run Swift Unit Tests
        run: swift test -v

      - name: Compile & Assemble App Bundle (Release)
        run: ./build_app.sh release

      - name: Build Installer Package (.pkg)
        run: ./create_installer.sh

      - name: Build Disk Image (.dmg)
        run: ./create_dmg.sh

      - name: Package Standalone App (.zip)
        run: |
          echo "📦 Packaging SmurfAudio-Mac.zip using ditto to preserve macOS metadata and code signatures..."
          ditto -c -k --sequesterRsrc --keepParent SmurfAudio.app SmurfAudio-Mac.zip

      - name: Generate SHA-256 Checksums
        run: |
          echo "🔒 Generating SHA-256 checksums..."
          shasum -a 256 SmurfAudio.dmg SmurfAudioInstaller.pkg SmurfAudio-Mac.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version_tag }}
          name: SmurfAudio ${{ steps.get_version.outputs.version_tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            SmurfAudio.dmg
            SmurfAudioInstaller.pkg
            SmurfAudio-Mac.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
